name: Tienda Pago
description: 'Tienda Pago is a fintech lender providing working capital and short-term
  inventory financing to small retailers - bodegas, convenience stores, bars and restaurants -
  across Mexico and Peru. Operating as a non-regulated financial entity (SOFOM E.N.R.), it offers
  three core products: LanaYa instant cash deposits, buy-now-pay-later 7-day terms for buying inventory
  from distributors, and no-upfront-cash mobile phone top-up (recargas). The platform reports serving
  over 80,000 businesses and more than 18 million families through mobile apps and a web onboarding portal.
  It is backed by QED Investors. No public API, developer portal, or SDK surface has been identified.'
